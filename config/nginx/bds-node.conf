server {
    listen 80;
    listen [::]:80;
    server_name panel.bds-node.me panel1.bds-node.me sub.bds-node.me sub1.bds-node.me cdn.bds-node.me cdn1.bds-node.me direct.bds-node.me direct1.bds-node.me *.bds-node.me;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 1. 3x-ui Admin Panel Proxy (panel.bds-node.me / panel1.bds-node.me)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.bds-node.me panel1.bds-node.me;

    ssl_certificate /etc/nginx/ssl/bds-node/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/bds-node/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:2087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
}

# 2. Subscription API Proxy (sub.bds-node.me / sub1.bds-node.me)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sub.bds-node.me sub1.bds-node.me;

    ssl_certificate /etc/nginx/ssl/bds-node/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/bds-node/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:2096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# 3. Cloudflare CDN WebSocket Inbounds Proxy (cdn.bds-node.me / cdn1.bds-node.me)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cdn.bds-node.me cdn1.bds-node.me;

    ssl_certificate /etc/nginx/ssl/bds-node/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/bds-node/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /vless-ws {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /vmess-ws {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /trojan-ws {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /ss-ws {
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        return 200 "OK";
    }
}
