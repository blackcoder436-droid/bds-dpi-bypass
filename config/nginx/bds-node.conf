map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name {{PANEL_DOMAIN}} {{SUB_DOMAIN}} {{CDN_DOMAIN}};

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name {{PANEL_DOMAIN}};

    ssl_certificate {{TLS_CERT_FILE}};
    ssl_certificate_key {{TLS_KEY_FILE}};
    ssl_protocols TLSv1.2 TLSv1.3;

    location /{{XUI_WEB_BASE_PATH}}/ {
        # 3x-UI itself runs at the upstream root. Strip only the public prefix
        # so /panel/login and /panel/panel/api/... reach /login and
        # /panel/api/... respectively, which is what the control plane expects.
        proxy_pass http://127.0.0.1:{{XUI_PANEL_PORT}}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:{{XUI_PANEL_PORT}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name {{SUB_DOMAIN}};

    ssl_certificate {{TLS_CERT_FILE}};
    ssl_certificate_key {{TLS_KEY_FILE}};
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:{{XUI_SUB_PORT}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name {{CDN_DOMAIN}};

    ssl_certificate {{TLS_CERT_FILE}};
    ssl_certificate_key {{TLS_KEY_FILE}};
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /healthz {
        default_type text/plain;
        return 200 "OK\n";
    }

    location /vless-ws {
        proxy_pass http://127.0.0.1:10001;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /vmess-ws {
        proxy_pass http://127.0.0.1:10002;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /trojan-ws {
        proxy_pass http://127.0.0.1:10003;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        return 404;
    }
}
